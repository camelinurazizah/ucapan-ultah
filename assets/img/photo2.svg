<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071633"/>
      <stop offset="60%" stop-color="#0f3460"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f77f00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d62828" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#skyGrad2)"/>

  <!-- Mountain Silhouettes -->
  <path d="M-50 850 L180 580 L420 850 Z" fill="#0b1b3d" opacity="0.9"/>
  <path d="M220 850 L520 500 L820 850 Z" fill="#061129" opacity="0.95"/>
  <path d="M380 850 L640 590 L900 850 Z" fill="#040b1c"/>

  <!-- Glowing Sun / Star on horizon -->
  <circle cx="520" cy="500" r="140" fill="url(#sunGlow)"/>

  <!-- Stars -->
  <circle cx="150" cy="120" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="320" cy="200" r="1.6" fill="#ffd166" opacity="0.8"/>
  <circle cx="650" cy="110" r="2.2" fill="#caf0f8" opacity="0.9"/>
  <circle cx="720" cy="280" r="1.4" fill="#ffffff" opacity="0.7"/>

  <!-- Text & Memory -->
  <g transform="translate(400, 360)" text-anchor="middle">
    <!-- Camera icon -->
    <rect x="-35" y="-50" width="70" height="48" rx="8" fill="none" stroke="#90e0ef" stroke-width="3"/>
    <circle cx="0" cy="-26" r="14" fill="none" stroke="#ffd166" stroke-width="3"/>
    <rect x="12" y="-58" width="14" height="8" rx="2" fill="#90e0ef"/>

    <text y="40" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="700" letter-spacing="2">ADVENTURES &amp; ESCAPES</text>
    <text y="75" fill="#caf0f8" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" letter-spacing="1">"Every Road with You is Home"</text>
    <text y="110" fill="#ffd166" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" letter-spacing="1">Ganti dengan fotomu &amp; Riki di assets/img/photo2.jpg</text>
  </g>

  <!-- Modern aesthetic border -->
  <rect x="25" y="25" width="750" height="950" rx="20" fill="none" stroke="#90e0ef" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8 6"/>
</svg>

