<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03081e"/>
      <stop offset="50%" stop-color="#0c2356"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <radialGradient id="sparkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#90e0ef" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0077b6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#skyGrad3)"/>

  <!-- Decorative geometric rings -->
  <circle cx="400" cy="450" r="240" fill="none" stroke="#90e0ef" stroke-width="1" stroke-opacity="0.25"/>
  <circle cx="400" cy="450" r="180" fill="none" stroke="#ffd166" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="10 8"/>
  <circle cx="400" cy="450" r="120" fill="none" stroke="#caf0f8" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Center sparkle burst -->
  <circle cx="400" cy="450" r="80" fill="url(#sparkleGlow)"/>

  <!-- Coffee / Date icons -->
  <g transform="translate(400, 450)" text-anchor="middle">
    <path d="M-20,-25 L20,-25 L15,15 C15,22 -15,22 -15,15 Z" fill="#ffd166" opacity="0.9"/>
    <path d="M15,-18 C25,-18 25,-2 15,-2" fill="none" stroke="#ffd166" stroke-width="4"/>
    <path d="M-30,22 L30,22" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    <text y="100" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="700" letter-spacing="2">LAUGHTER &amp; COFFEE DATES</text>
    <text y="135" fill="#caf0f8" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" letter-spacing="1">"In Your Eyes, I Found Peace"</text>
    <text y="170" fill="#ffd166" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" letter-spacing="1">Ganti dengan fotomu &amp; Riki di assets/img/photo3.jpg</text>
  </g>

  <!-- Modern aesthetic border -->
  <rect x="25" y="25" width="750" height="950" rx="20" fill="none" stroke="#90e0ef" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8 6"/>
</svg>

